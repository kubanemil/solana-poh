[workspace]
resolver = "3"
members = ["crates/poh-core", "crates/poh-cli", "crates/poh-py"]
default-members = ["crates/poh-core", "crates/poh-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kubanemil/solana-poh"

[workspace.dependencies]
poh-core = { path = "crates/poh-core" }
sha2 = { version = "0.11", default-features = false }
rayon = "1.12"
lexopt = "0.3"
pyo3 = { version = "0.30", features = ["abi3-py310"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde_json = "1"
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev.package.sha2]
opt-level = 3

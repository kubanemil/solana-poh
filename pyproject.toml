[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "solana-poh"
version = "0.1.0"
description = "Solana Proof of History: a fast Rust generator and verifier with Python bindings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emil Kuban" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/kubanemil/solana-poh"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "ruff>=0.15"]

[tool.maturin]
manifest-path = "crates/poh-py/Cargo.toml"
python-source = "python"
module-name = "solana_poh._core"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["solana_poh"]
